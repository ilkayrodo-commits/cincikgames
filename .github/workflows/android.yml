name: Android APK

on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Restore signing key
        run: base64 -d app/debug.keystore.b64 > app/debug.keystore

      - name: Test
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CincikNot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CincikNot-apk
          path: CincikNot.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Cincik Not (derleme ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          body: |
            Telefona kurmak için aşağıdaki **CincikNot.apk** dosyasına dokun.
            Commit: ${{ github.sha }}
          files: CincikNot.apk
