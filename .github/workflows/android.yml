name: Android APK

on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Restore signing key
        run: base64 -d app/debug.keystore.b64 > app/debug.keystore

      - name: Test
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build APKs
        run: |
          gradle --no-daemon :app:assembleDebug
          (cd wallpapers && gradle --no-daemon :app:assembleDebug)

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CincikNot.apk
          cp wallpapers/app/build/outputs/apk/debug/app-debug.apk CincikDuvar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            CincikNot.apk
            CincikDuvar.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Cincik uygulamaları (derleme ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          body: |
            - **CincikDuvar.apk**: 10 hareketli duvar kağıdı
            - **CincikNot.apk**: el yazısı / ses ile not
            Commit: ${{ github.sha }}
          files: |
            CincikNot.apk
            CincikDuvar.apk
